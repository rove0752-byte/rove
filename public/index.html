<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rove — Web workspace</title><style>
*{box-sizing:border-box}:root{--bg:#FAF9F7;--ink:#1F1E1C;--mute:#6B6862;--faint:#8F8B84;--line:#E7E4DE;--card:#FFFFFF;--acc:#8A5E45;--acc2:#74503B}html,body{height:100%}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.55 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column;min-height:100vh}header{padding:22px 28px}.brand{font-size:22px;font-weight:700;letter-spacing:-1px;color:var(--ink)}.brand span{color:var(--acc)}main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 24px 8vh;transition:padding .4s}body.engaged main{justify-content:flex-start;padding-top:6vh}.wrap{width:100%;max-width:720px}h1{font-size:34px;font-weight:600;letter-spacing:-.8px;text-align:center;margin:0 0 28px;color:var(--ink)}.prompt{position:relative;background:var(--card);border:1px solid var(--line);border-radius:24px;box-shadow:0 1px 2px rgba(31,30,28,.03),0 10px 30px rgba(31,30,28,.05);transition:border-color .2s,box-shadow .2s}.prompt:focus-within{border-color:#D9D3CA;box-shadow:0 0 0 4px rgba(138,94,69,.10),0 10px 30px rgba(31,30,28,.06)}.prompt textarea{display:block;width:100%;border:0;background:transparent;resize:none;font:inherit;font-size:16px;color:var(--ink);padding:22px 70px 22px 24px;min-height:96px;outline:0}textarea::placeholder,input::placeholder{color:var(--faint)}#send{position:absolute;right:14px;bottom:14px;width:40px;height:40px;border-radius:50%;border:0;background:var(--acc);color:#fff;font-size:18px;cursor:pointer;transition:background .2s,opacity .2s}#send:hover{background:var(--acc2)}.below{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:14px;min-height:28px}.chips{display:flex;gap:8px;flex-wrap:wrap;opacity:0;transform:translateY(-3px);transition:opacity .3s,transform .3s;pointer-events:none}body.focused .chips{opacity:1;transform:none;pointer-events:auto}.chip{font:inherit;font-size:13px;color:var(--mute);background:transparent;border:1px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer}.chip:hover{color:var(--ink);border-color:#D9D3CA}.link{font:inherit;font-size:13px;color:var(--faint);background:none;border:0;padding:0;cursor:pointer}.link:hover{color:var(--ink)}.reveal{overflow:hidden;animation:in .3s ease}@keyframes in{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}[hidden]{display:none!important}.which{display:flex;align-items:center;gap:10px;margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 6px 6px 16px}.which label{font-size:13px;color:var(--mute);white-space:nowrap}.which input,.adv input{flex:1;border:0;background:transparent;font:inherit;color:var(--ink);padding:8px 0;outline:0}.which button{font:inherit;font-size:13px;border:0;border-radius:10px;padding:8px 14px;background:#F1EEE9;color:var(--ink);cursor:pointer}.err{color:#8A4B3A;font-size:13px;margin:8px 4px 0}.adv{margin-top:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px}.adv p{margin:0 0 8px;font-size:13px;color:var(--mute)}.adv input{width:100%;border-bottom:1px solid var(--line)}.status{font-size:12px;color:var(--faint);margin-top:8px}#task{display:none}.results{margin-top:28px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px 26px}.results h2{font-size:18px;font-weight:600;margin:0 0 6px}.results p{margin:0;color:var(--mute)}.actions{display:flex;gap:8px;margin-top:16px}.actions button{font:inherit;font-size:13px;border:1px solid var(--line);border-radius:10px;padding:8px 14px;background:transparent;color:var(--ink);cursor:pointer}.actions button:disabled{opacity:.5;cursor:wait}pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.55 ui-monospace,Menlo,monospace;background:#F5F3EF;color:var(--ink);border-radius:12px;padding:16px;max-height:520px;overflow:auto;margin:16px 0 0}img{max-width:100%;border-radius:12px;margin-top:16px}footer{text-align:center;padding:18px;font-size:12px;color:var(--faint)}footer .link{font-size:12px;text-decoration:underline;text-underline-offset:2px}dialog{border:1px solid var(--line);border-radius:18px;padding:24px;max-width:560px;width:calc(100% - 40px);background:var(--card);color:var(--ink);box-shadow:0 20px 60px rgba(31,30,28,.15)}dialog::backdrop{background:rgba(31,30,28,.25)}dialog h2{font-size:16px;margin:0}dialog .link{float:right}@media(max-width:640px){h1{font-size:27px}}.keycard{margin-top:18px;border:1px solid var(--line);background:#FBF8F4;border-radius:14px;padding:18px}.keycard h3{margin:0 0 4px;font-size:15px;font-weight:600}.keycard p{font-size:13px}.keyrow{display:flex;gap:8px;margin-top:12px}.keyrow input,.dlgin{flex:1;width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font:inherit;background:#fff;color:var(--ink);outline:0}.keyrow input:focus,.dlgin:focus{border-color:#D9D3CA;box-shadow:0 0 0 3px rgba(138,94,69,.10)}#keysave{font:inherit;font-size:13px;border:0;border-radius:10px;padding:10px 16px;background:var(--acc);color:#fff;cursor:pointer;white-space:nowrap}.dlgp{font-size:13px;color:var(--mute);margin:10px 0 14px}.trialhint{font-size:12px;color:var(--mute)}.keycard .more{margin-top:10px}.keycard a{color:var(--acc);font-size:13px;font-weight:600;text-decoration:none}</style>
<header><div class="brand">rove<span>.</span></div></header><main><div class="wrap"><h1 id="greet">What should Rove find on the web?</h1><form id="ask" class="prompt" novalidate><textarea id="prompt" rows="2" aria-label="Ask Rove" placeholder="Ask about any website… e.g. summarise example.com"></textarea><button type="submit" id="send" aria-label="Send">↑</button></form><div class="which reveal" id="which" hidden><label for="url">Which website?</label><input id="url" type="url" placeholder="example.com" autocomplete="url"><button type="button" id="go">Continue</button></div><p class="err" id="urlerr" hidden></p><div class="below"><div class="chips"><button type="button" class="chip" data-t="Summarise this page">Summarise a page</button><button type="button" class="chip" data-t="Extract product names and prices">Extract prices</button><button type="button" class="chip" data-t="Get all headings and links">Get links</button></div><span class="trialhint" id="trialhint" hidden></span></div><textarea id="task" aria-hidden="true" tabindex="-1"></textarea><section class="results reveal" id="step2" hidden><h2 id="title">Your first run starts here.</h2><p id="message"></p><pre id="output" hidden></pre><img id="shot" hidden alt="Captured page screenshot"><div class="keycard reveal" id="limitcard" hidden><h3>You&#39;ve used today&#39;s free runs</h3><p id="resetat">They reset tomorrow.</p><p class="more"><a href="mailto:hello@rovezi.com?subject=More%20Rove%20runs">Get more runs →</a></p></div><div class="actions"><button id="run">Run again</button><button id="extract">Inspect page</button></div></section></div></main><footer>Public pages only · No sign-ins or submissions · <a class="link" href="/developers">API</a></footer><script>
const $=id=>document.getElementById(id);const headers=()=>({'Content-Type':'application/json'});

async function execute(ai){$('run').disabled=$('extract').disabled=true;$('title').textContent=ai?'Starting task…':'Inspecting page…';$('message').textContent='';$('shot').hidden=true;$('output').hidden=true;$('limitcard').hidden=true;try{const url=$('url').value.trim();new URL(url);const r=await fetch(ai?'/v1/agent/run':'/v1/extract',{method:'POST',headers:headers(),body:JSON.stringify(ai?{url,task:$('task').value}:{url})});const d=await r.json();if(d.code==='trial_exhausted'){exhausted(d);return;}if(!r.ok)throw new Error(d.error||'Run failed');if(d.trial)hint(d.trial.remaining);if(ai){$('title').textContent='Task accepted';$('message').textContent='Waiting for agent events…';const stream=await fetch(d.streamUrl,{headers:headers()});if(!stream.ok)throw new Error('Could not connect to the run stream');const reader=stream.body.getReader(),decoder=new TextDecoder();let text='';$('output').hidden=false;while(true){const chunk=await reader.read();if(chunk.done)break;text+=decoder.decode(chunk.value,{stream:true});$('output').textContent=text;$('output').scrollTop=$('output').scrollHeight;}$('title').textContent='Run stream ended';$('message').textContent='Inspect the events for the final answer or reported failure.';}else{const image=d.screenshotBase64;delete d.screenshotBase64;$('title').textContent=d.title||'Page captured';$('message').textContent=d.url;$('output').hidden=false;$('output').textContent=JSON.stringify(d,null,2);$('shot').src='data:image/png;base64,'+image;$('shot').hidden=false;}}catch(e){$('title').textContent='Run could not start';$('message').textContent=e.message;}finally{$('run').disabled=$('extract').disabled=false;}}
function hint(n){const h=$('trialhint');if(typeof n==='number'&&n<=2){h.textContent=n===0?'No free runs left today':n===1?'1 free run left today':n+' free runs left today';h.hidden=false;}else h.hidden=true;}
function exhausted(d){$('title').textContent='Free runs used';$('message').textContent='';hint(0);let t='tomorrow';try{t='at '+new Date(d.resetsAt).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})+' tomorrow';}catch{}$('resetat').textContent='They reset '+t+'.';$('limitcard').hidden=false;}
fetch('/v1/trial').then(r=>r.ok?r.json():null).then(d=>{if(d)hint(d.remaining);}).catch(()=>{});
const URLRE=/(https?:[/][/][^ ]+)|((?:[a-z0-9-]+[.])+[a-z]{2,}(?:[/][^ ]*)?)/i;
function norm(v){v=v.trim().replace(/[),.;!?]+$/,'');if(!v)return null;if(!v.includes('://'))v='https://'+v;try{const u=new URL(v);return /^https?:$/.test(u.protocol)?u.href:null}catch{return null}}
function start(){const url=norm($('url').value);if(!url){$('urlerr').textContent='Enter a website address, like example.com';$('urlerr').hidden=false;$('url').focus();return;}$('urlerr').hidden=true;$('url').value=url;if(!$('task').value.trim())$('task').value='Summarise this page';document.body.classList.add('engaged');$('step2').hidden=false;execute(true);}
function submitPrompt(){const t=$('prompt').value.trim();if(!t)return $('prompt').focus();const m=t.match(URLRE);if(m){$('url').value=m[0];$('task').value=(t.slice(0,m.index)+t.slice(m.index+m[0].length)).replace(/ +/g,' ').trim();$('which').hidden=true;start();}else{$('task').value=t;$('which').hidden=false;$('url').focus();}}
$('ask').onsubmit=e=>{e.preventDefault();submitPrompt();};$('prompt').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();submitPrompt();}});
$('prompt').addEventListener('focus',()=>document.body.classList.add('focused'));$('prompt').addEventListener('input',()=>document.body.classList.add('focused'));
$('go').onclick=start;$('url').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();start();}});
document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{const p=$('prompt');p.value=c.dataset.t+(p.value.trim()?' '+p.value.trim():' ');p.focus();});
$('run').onclick=()=>execute(true);$('extract').onclick=()=>execute(false);
</script></html>
